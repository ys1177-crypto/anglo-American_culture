<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1920s · Great Depression · Atomic Age · Baby Boom</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#eef2f9;--white:#ffffff;--surface:#f5f7fc;--border:#d4dcea;--border2:#b0bdd6;
  --ink:#0f1e36;--ink2:#3a4f6e;--ink3:#8294b0;
  --navy:#1a3a6e;--navy-lt:#2450a0;--navy-bg:#e8eef9;--navy-bd:#adc0e8;
  --sky:#0e7fbe;--sky-bg:#e6f4fc;--sky-bd:#90cef0;
  --teal:#0c8a78;--teal-bg:#e6f7f4;--teal-bd:#8ed6cc;
  --coral:#d94f3a;--coral-bg:#fdf0ee;--coral-bd:#f0b0a6;
  --amber:#c47a0a;--amber-bg:#fdf6e6;--amber-bd:#f0d080;
  --lime:#4d8c1e;--lime-bg:#eef7e6;--lime-bd:#b0d890;
  --purple:#6b3fa0;--purple-bg:#f3eefe;--purple-bd:#c9aaf0;
  --shadow:0 2px 20px rgba(26,58,110,.09);--shadow-lg:0 8px 48px rgba(26,58,110,.14);--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;min-height:100vh;}
header{background:var(--navy);padding:1rem 2rem;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(10,20,50,.25);}
.hdr{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:1.2rem;}
.hdr-badge{background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.25);border-radius:6px;padding:.25rem .65rem;font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.85);flex-shrink:0;}
.hdr-titles{flex:1;}
.hdr-h1{font-size:clamp(.78rem,1.9vw,.98rem);font-weight:700;color:#fff;}
.hdr-prog{width:155px;flex-shrink:0;}
@media(max-width:480px){.hdr-prog{display:none!important;}.hdr-h1{font-size:.78rem;}}
.hdr-prog-lbl{font-size:.62rem;color:rgba(255,255,255,.55);text-align:right;margin-bottom:.25rem;font-weight:500;}
.hdr-bar{height:5px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden;}
.hdr-fill{height:100%;background:linear-gradient(90deg,#5eb3f5,#38e0c0);border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);}
#start-screen{max-width:400px;margin:4rem auto;padding:0 1.5rem;animation:up .4s ease;}
.start-card{background:var(--white);border:2px solid var(--navy-bd);border-radius:var(--r);padding:2.2rem 2rem;box-shadow:var(--shadow-lg);}
.start-card h2{font-size:1.35rem;font-weight:800;margin-bottom:.25rem;color:var(--navy);}
.start-card>.sub{font-size:.84rem;color:var(--ink2);margin-bottom:1.5rem;}
.member-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:1.3rem;}
.member-label{font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-lt);margin-bottom:.28rem;display:block;}
.member-input{padding:.58rem .78rem;border:2px solid var(--border);border-radius:8px;font-family:'Outfit',sans-serif;font-size:.88rem;color:var(--ink);background:var(--white);outline:none;transition:border-color .18s;width:100%;font-weight:500;}
.member-input:focus{border-color:var(--navy-lt);}
.btn-go{width:100%;padding:.82rem;background:var(--navy);color:#fff;border:none;border-radius:9px;font-family:'Outfit',sans-serif;font-weight:700;font-size:1rem;cursor:pointer;transition:background .18s;}
.btn-go:hover{background:var(--navy-lt);}
main{display:none;max-width:880px;margin:0 auto;padding:2rem 1.5rem 6rem;}
.act-card{background:var(--white);border:2px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);animation:up .4s ease;margin-bottom:1rem;}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.act-head{display:flex;align-items:center;gap:.65rem;padding:.82rem 1.4rem;border-bottom:2px solid var(--border);background:var(--surface);flex-wrap:wrap;}
.type-pill{font-size:.58rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;padding:.2rem .65rem;border-radius:20px;flex-shrink:0;}
.p-tf{background:var(--teal-bg);color:var(--teal);border:1.5px solid var(--teal-bd);}
.p-fl{background:var(--lime-bg);color:var(--lime);border:1.5px solid var(--lime-bd);}
.p-mt{background:var(--amber-bg);color:var(--amber);border:1.5px solid var(--amber-bd);}
.p-rj{background:var(--coral-bg);color:var(--coral);border:1.5px solid var(--coral-bd);}
.p-mc{background:var(--purple-bg);color:var(--purple);border:1.5px solid var(--purple-bd);}
.p-sq{background:var(--sky-bg);color:var(--sky);border:1.5px solid var(--sky-bd);}
.p-ce{background:var(--sky-bg);color:var(--sky);border:1.5px solid var(--sky-bd);}
.act-rdg{font-size:.66rem;color:var(--ink3);font-weight:600;}
.act-num{font-size:.66rem;font-weight:800;background:var(--navy-bg);color:var(--navy);padding:.18rem .6rem;border-radius:20px;margin-left:auto;}
.act-body{padding:1.5rem 1.4rem;}
.q-en{font-size:1rem;font-weight:700;line-height:1.52;color:var(--ink);margin-bottom:1.1rem;}
.sub-row{display:flex;justify-content:flex-end;margin-top:1rem;}
.btn-sub{padding:.54rem 1.4rem;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:700;font-size:.84rem;cursor:pointer;transition:all .18s;}
.btn-sub:hover{background:var(--navy-lt);transform:translateY(-1px);}
.btn-sub:disabled{background:var(--border2);color:var(--ink3);cursor:default;transform:none;}
.done-badge{display:inline-flex;align-items:center;gap:.45rem;margin-top:1rem;background:var(--teal-bg);border:1.5px solid var(--teal-bd);border-radius:8px;padding:.52rem 1rem;font-size:.82rem;color:var(--teal);font-weight:600;}
.btn-next-q{display:block;width:100%;margin-top:.65rem;background:var(--navy);color:#fff;border:none;border-radius:9px;padding:.72rem;font-family:'Outfit',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .18s;text-align:center;}
.btn-next-q:hover{background:var(--navy-lt);}
.sec-div{display:flex;align-items:center;gap:1rem;margin:2.2rem 0 1.5rem;}
.sec-div::before,.sec-div::after{content:'';flex:1;height:2px;background:var(--navy-bd);}
.sec-div span{font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--navy);white-space:nowrap;background:var(--navy-bg);padding:.28rem .85rem;border-radius:20px;}
/* TF */
.tf-table{width:100%;border-collapse:collapse;margin-bottom:.5rem;}
.tf-table th{font-size:.63rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);padding:.5rem .75rem;text-align:left;border-bottom:2px solid var(--border);}
.tf-table th.th-tf{text-align:center;width:148px;}
.tf-row td{padding:.72rem .75rem;border-bottom:1px solid var(--border);font-size:.88rem;line-height:1.5;vertical-align:top;}
.tf-row:last-child td{border-bottom:none;}
.tf-btns{display:flex;gap:.4rem;justify-content:center;}
.tf-btn{padding:.38rem .95rem;border:2px solid var(--border2);border-radius:20px;font-family:'Outfit',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;background:var(--white);color:var(--ink2);transition:all .18s;min-width:52px;}
.tf-btn:hover:not(:disabled){border-color:var(--teal);background:var(--teal-bg);color:var(--teal);}
.tf-btn.sel-t{border-color:var(--teal);background:var(--teal-bg);color:var(--teal);}
.tf-btn.sel-f{border-color:var(--coral);background:var(--coral-bg);color:var(--coral);}
.tf-btn:disabled{cursor:default;opacity:.65;}
.corr-wrap{margin-top:.55rem;animation:up .25s ease;}
.corr-lbl{font-size:.62rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:.28rem;display:block;}
.corr-ta{width:100%;min-height:52px;padding:.38rem .6rem;border:2px solid var(--coral-bd);border-radius:7px;font-family:'Outfit',sans-serif;font-size:.83rem;color:var(--ink);background:var(--coral-bg);outline:none;resize:none;font-weight:400;line-height:1.5;transition:border-color .18s;}
.corr-ta:focus{border-color:var(--coral);}
.corr-ta::placeholder{color:#c08880;}
@media(max-width:500px){.tf-table th.th-tf{width:108px;}.tf-btn{padding:.3rem .52rem;font-size:.74rem;min-width:40px;}}
/* FILL */
.fill-sent{font-size:.92rem;line-height:2.7;color:var(--ink);margin-bottom:.9rem;font-weight:500;word-break:break-word;}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--lime);padding:0 .28rem;margin:0 .12rem;color:var(--lime);font-style:italic;font-weight:600;cursor:pointer;vertical-align:bottom;text-align:center;white-space:nowrap;}
.blank.filled{color:var(--ink);font-style:normal;font-weight:600;border-color:var(--border2);}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-bottom:.9rem;}
.chip{padding:.35rem .9rem;border:2px solid var(--border2);border-radius:20px;font-size:.83rem;cursor:pointer;background:var(--white);color:var(--ink);font-family:'Outfit',sans-serif;font-weight:600;transition:all .18s;touch-action:manipulation;}
.chip:hover:not(.used):not(:disabled){border-color:var(--lime);background:var(--lime-bg);color:var(--lime);}
.chip.used{opacity:.28;cursor:default;}
/* MATCHING */
.match-hint{font-size:.78rem;color:var(--ink2);font-style:italic;margin-bottom:.75rem;font-weight:500;background:var(--amber-bg);border:1.5px solid var(--amber-bd);border-left:4px solid var(--amber);border-radius:0 8px 8px 0;padding:.6rem .9rem;}
.match-sel-banner{display:none;background:var(--navy-bg);border:2px solid var(--navy-bd);border-radius:8px;padding:.55rem .9rem;font-size:.82rem;font-weight:600;color:var(--navy);margin-bottom:.7rem;}
.match-sel-banner.active{display:block;}
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
@media(max-width:540px){.match-grid{grid-template-columns:1fr;gap:.5rem;}}
.match-col-lbl{font-size:.63rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);margin-bottom:.48rem;}
.match-items{display:flex;flex-direction:column;gap:.4rem;}
.match-item{padding:.65rem .85rem;border:2px solid var(--border);border-radius:8px;font-size:.83rem;line-height:1.4;cursor:pointer;background:var(--white);transition:all .18s;font-weight:500;touch-action:manipulation;}
.match-item.sel{border-color:var(--navy-lt);background:var(--navy-bg);color:var(--navy);font-weight:700;box-shadow:0 0 0 3px rgba(36,80,160,.18);}
.match-item.matched{border-color:var(--teal-bd);background:var(--teal-bg);color:var(--teal);font-weight:600;}
.match-item.matched::before{content:'✓ ';font-weight:800;}
/* MULTIPLE CHOICE */
.mc-note{font-size:.82rem;color:var(--ink2);background:var(--purple-bg);border:1.5px solid var(--purple-bd);border-left:4px solid var(--purple);border-radius:0 8px 8px 0;padding:.65rem 1rem;margin-bottom:1rem;font-weight:500;}
.mc-qs{display:flex;flex-direction:column;gap:1.3rem;}
.mc-q-block{background:var(--surface);border:2px solid var(--border);border-radius:10px;padding:1rem 1.1rem;}
.mc-q-text{font-size:.92rem;font-weight:700;color:var(--ink);margin-bottom:.75rem;line-height:1.5;}
.mc-opts{display:flex;flex-direction:column;gap:.38rem;}
.mc-opt{display:flex;align-items:flex-start;gap:.65rem;padding:.5rem .75rem;border:2px solid var(--border);border-radius:8px;cursor:pointer;background:var(--white);transition:all .18s;font-size:.87rem;line-height:1.45;font-weight:500;touch-action:manipulation;}
.mc-opt:hover:not(.mc-disabled){border-color:var(--purple-bd);background:var(--purple-bg);}
.mc-opt.sel{border-color:var(--purple);background:var(--purple-bg);color:var(--purple);font-weight:600;}
.mc-opt.mc-disabled{cursor:default;}
.mc-letter{font-size:.75rem;font-weight:800;color:var(--ink3);min-width:1.1rem;margin-top:.05rem;flex-shrink:0;}
.mc-opt.sel .mc-letter{color:var(--purple);}
/* SEQUENCING */
.sq-note{font-size:.82rem;color:var(--ink2);background:var(--sky-bg);border:1.5px solid var(--sky-bd);border-left:4px solid var(--sky);border-radius:0 8px 8px 0;padding:.65rem 1rem;margin-bottom:1rem;font-weight:500;}
.sq-items{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.5rem;}
.sq-item{display:flex;align-items:center;gap:.7rem;padding:.6rem .85rem;border:2px solid var(--border);border-radius:8px;background:var(--white);font-size:.87rem;font-weight:500;line-height:1.4;cursor:grab;user-select:none;transition:box-shadow .18s,border-color .18s,opacity .18s;}
.sq-item.dragging{opacity:.4;border-color:var(--sky);box-shadow:0 4px 18px rgba(14,127,190,.22);}
.sq-item.drag-over{border-color:var(--sky);background:var(--sky-bg);}
.sq-item.tapped{border-color:var(--sky);background:var(--sky-bg);box-shadow:0 0 0 3px rgba(14,127,190,.2);}
.sq-handle{font-size:1rem;color:var(--ink3);flex-shrink:0;}
.sq-num{font-size:.72rem;font-weight:800;color:var(--white);background:var(--sky);border-radius:50%;width:1.3rem;height:1.3rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
/* DISCUSSION */
.rj-note{font-size:.82rem;color:var(--ink2);background:var(--coral-bg);border:1.5px solid var(--coral-bd);border-left:4px solid var(--coral);border-radius:0 8px 8px 0;padding:.65rem 1rem;margin-bottom:.7rem;font-weight:500;}
.lang-note{font-size:.78rem;font-weight:600;color:var(--coral);background:rgba(217,79,58,.07);border:1.5px dashed var(--coral-bd);border-radius:7px;padding:.4rem .8rem;margin-bottom:1rem;display:inline-block;}
.disc-subqs{display:flex;flex-direction:column;gap:1rem;margin-bottom:1rem;}
.disc-subq{background:var(--surface);border:2px solid var(--border);border-radius:9px;padding:.9rem 1rem;}
.disc-subq-label{font-size:.63rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin-bottom:.5rem;display:block;}
.disc-subq-q{font-size:.9rem;font-weight:600;color:var(--ink);margin-bottom:.55rem;line-height:1.5;}
.disc-ta{width:100%;min-height:90px;padding:.55rem .8rem;border:2px solid var(--coral-bd);border-radius:7px;font-family:'Outfit',sans-serif;font-size:.86rem;color:var(--ink);background:var(--white);outline:none;resize:none;transition:border-color .18s;font-weight:400;line-height:1.5;}
.disc-ta:focus{border-color:var(--coral);}
.disc-ta::placeholder{color:var(--ink3);}
/* CAUSE & EFFECT */
.ce-note{font-size:.82rem;color:var(--ink2);background:var(--sky-bg);border:1.5px solid var(--sky-bd);border-left:4px solid var(--sky);border-radius:0 8px 8px 0;padding:.65rem 1rem;margin-bottom:.7rem;font-weight:500;}
.ce-lang-note{font-size:.78rem;font-weight:600;color:var(--sky);background:rgba(14,127,190,.07);border:1.5px dashed var(--sky-bd);border-radius:7px;padding:.4rem .8rem;margin-bottom:1rem;display:inline-block;}
.ce-cards{display:flex;flex-direction:column;gap:.75rem;}
.ce-card{background:var(--surface);border:2px solid var(--border);border-radius:10px;overflow:hidden;}
.ce-card-head{background:var(--sky-bg);border-bottom:2px solid var(--sky-bd);padding:.55rem 1rem;}
.ce-card-event{font-size:.85rem;font-weight:800;color:var(--sky);}
.ce-card-body{display:grid;grid-template-columns:1fr 1fr;}
@media(max-width:480px){.ce-card-body{grid-template-columns:1fr;}}
.ce-field{padding:.7rem .9rem;border-right:1px solid var(--border);}
.ce-field:last-child{border-right:none;}
@media(max-width:480px){.ce-field{border-right:none;border-bottom:1px solid var(--border);}.ce-field:last-child{border-bottom:none;}}
.ce-field-lbl{font-size:.6rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);margin-bottom:.35rem;display:block;}
.ce-ta{width:100%;min-height:60px;padding:.42rem .6rem;border:2px solid var(--border);border-radius:7px;font-family:'Outfit',sans-serif;font-size:.83rem;color:var(--ink);background:var(--white);outline:none;resize:none;font-weight:400;transition:border-color .18s;line-height:1.5;}
.ce-ta:focus{border-color:var(--sky);}
/* FINAL */
#final-screen{display:none;max-width:880px;margin:0 auto;padding:2.5rem 1.5rem 6rem;animation:up .5s ease;}
.final-hero{background:linear-gradient(135deg,var(--navy) 0%,var(--sky) 100%);border-radius:var(--r);padding:2.5rem;text-align:center;margin-bottom:1.5rem;box-shadow:0 8px 36px rgba(14,58,120,.28);}
.final-hero .fi{font-size:2.4rem;margin-bottom:.7rem;}
.final-hero h2{font-size:1.65rem;font-weight:800;color:#fff;margin-bottom:.3rem;}
.final-hero p{font-size:.9rem;color:rgba(255,255,255,.75);}
.final-group-tag{display:inline-block;margin-top:1rem;background:rgba(255,255,255,.18);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:20px;padding:.35rem 1.2rem;font-size:.82rem;font-weight:700;}
.score-row{display:inline-flex;gap:2.5rem;margin-top:1.2rem;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.28);border-radius:10px;padding:.7rem 2rem;}
.score-item{text-align:center;}
.score-n{font-size:1.9rem;font-weight:800;color:#fff;display:block;}
.score-l{font-size:.62rem;color:rgba(255,255,255,.6);letter-spacing:.12em;text-transform:uppercase;}
.ans-section{margin-bottom:1.5rem;}
.ans-section-title{font-size:.68rem;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--navy);margin-bottom:.8rem;display:flex;align-items:center;gap:.6rem;}
.ans-section-title::after{content:'';flex:1;height:2px;background:var(--navy-bd);}
.ans-cards{display:flex;flex-direction:column;gap:.7rem;}
.ans-card{background:var(--white);border:2px solid var(--border);border-radius:var(--r);overflow:hidden;}
.ans-head{display:flex;align-items:center;gap:.65rem;padding:.65rem 1.1rem;border-bottom:2px solid var(--border);background:var(--surface);flex-wrap:wrap;}
.ans-qtext{font-size:.8rem;color:var(--ink2);flex:1;font-weight:500;}
.ans-body{padding:.9rem 1.1rem;}
.ans-response{font-size:.87rem;line-height:1.65;white-space:pre-wrap;color:var(--ink);font-weight:400;}
.ans-model{margin-top:.8rem;padding:.8rem 1rem;border-top:2px dashed var(--border);font-size:.83rem;line-height:1.7;color:var(--ink2);background:var(--amber-bg);border-radius:0 0 10px 10px;}
.ans-model strong{color:var(--ink);font-weight:700;}
.ans-model ul,.ans-model ol{padding-left:1.1rem;}
.ans-model li{margin-bottom:.35rem;}
.ans-model table{border-collapse:collapse;width:100%;font-size:.81rem;margin-top:.5rem;}
.ans-model th,.ans-model td{border:1px solid var(--border);padding:.4rem .6rem;text-align:left;}
.ans-model th{background:var(--surface);font-weight:700;}
.copy-box{background:var(--white);border:2px solid var(--navy-bd);border-radius:var(--r);padding:1.5rem;box-shadow:var(--shadow);}
.copy-box h3{font-size:1.05rem;font-weight:800;margin-bottom:.25rem;color:var(--navy);}
.copy-box p{font-size:.8rem;color:var(--ink2);margin-bottom:.9rem;}
#copy-ta{width:100%;height:160px;background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:.75rem;font-family:'Outfit',sans-serif;font-size:.78rem;color:var(--ink2);resize:none;outline:none;font-weight:400;}
.copy-btns{display:flex;gap:.7rem;margin-top:.8rem;}
.btn-copy{flex:1;padding:.65rem;background:var(--navy);color:#fff;border:none;border-radius:8px;font-family:'Outfit',sans-serif;font-weight:700;font-size:.9rem;cursor:pointer;transition:all .18s;}
.btn-copy:hover{background:var(--navy-lt);}
.btn-copy.ok{background:var(--teal);}
.btn-restart{padding:.65rem 1.2rem;background:var(--surface);border:2px solid var(--border2);border-radius:8px;font-family:'Outfit',sans-serif;font-size:.9rem;color:var(--ink2);cursor:pointer;font-weight:600;transition:all .18s;}
.btn-restart:hover{border-color:var(--navy);color:var(--navy);}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <div class="hdr-badge">History</div>
    <div class="hdr-titles">
      <div class="hdr-h1">1920s Culture · Great Depression · Atomic Age · Baby Boom</div>
    </div>
    <div class="hdr-prog" id="hdr-prog" style="display:none;">
      <div class="hdr-prog-lbl" id="prog-lbl">0 / 8 done</div>
      <div class="hdr-bar"><div class="hdr-fill" id="prog-fill" style="width:0%"></div></div>
    </div>
  </div>
</header>
<div id="start-screen">
  <div class="start-card">
    <h2>👋 Let's Begin</h2>
    <p class="sub">Enter your group members' names.</p>
    <div class="member-grid">
      <div><div class="member-label">1</div><input class="member-input" id="m1" type="text" placeholder="Name"></div>

let members=[],cur=0;
let submitted=new Array(Qs.length).fill(false);
let responses=new Array(Qs.length).fill('');
let tfSt={},fillSt={},matchSt={},mcSt={},seqSt={},seqTapSel={};

const LABELS={tf:'✅ True/False + Correction',fill:'✏️ Fill in the Blank',match:'📋 Matching',disc:'💬 Group Discussion',mc:'🔘 Multiple Choice',seq:'🔢 Sequencing',ce:'🔗 Cause & Effect'};
const PILLS={tf:'p-tf',fill:'p-fl',match:'p-mt',disc:'p-rj',mc:'p-mc',seq:'p-sq',ce:'p-ce'};
const RNAMES={'11+12':'R11+R12 — 1920s & Great Depression','13':'R13 — The Atomic Bomb','14':'R14 — The Baby Boom','13+14':'R13+R14 — Atomic Age & Baby Boom','11–14':'R11–R14 — Era Summary'};

function startActivity(){
  members=['m1','m2','m3','m4'].map(id=>document.getElementById(id).value.trim()).filter(Boolean);
  if(!members.length){alert('Please enter at least one name.');return;}
  document.getElementById('start-screen').style.display='none';
  document.getElementById('main').style.display='block';
  document.getElementById('hdr-prog').style.display='block';
  render();
}
function updProg(){
  const n=submitted.filter(Boolean).length;
  document.getElementById('prog-fill').style.width=Math.round(n/Qs.length*100)+'%';
  document.getElementById('prog-lbl').textContent=`${n} / ${Qs.length} done`;
}
function render(){
  const el=document.getElementById('main');
  if(cur>=Qs.length){showFinal();return;}
  const q=Qs[cur],prevR=cur>0?Qs[cur-1].r:null;
  let html='';
  if(q.r!==prevR) html+=`<div class="sec-div"><span>${RNAMES[q.r]||''}</span></div>`;
  html+=buildCard(q);
  el.innerHTML=html;
  updProg();
  if(q.type==='tf'){tfSt[q.id]=new Array(q.rows.length).fill(null);}
  if(q.type==='fill') fillSt[q.id]={};
  if(q.type==='match') matchSt[q.id]={leftSel:null,pairs:{}};
  if(q.type==='mc') mcSt[q.id]=new Array(q.qs.length).fill(null);
  if(q.type==='seq'){seqSt[q.id]=[...q.items].sort(()=>Math.random()-.5);seqTapSel[q.id]=null;setTimeout(()=>renderSeqItems(q.id),60);}
}
function buildCard(q){
  let h=`<div class="act-card"><div class="act-head">
    <span class="type-pill ${PILLS[q.type]}">${LABELS[q.type]}</span>
    <span class="act-rdg">Reading ${q.r}</span>
    <span class="act-num">Q${cur+1} / ${Qs.length}</span>
  </div><div class="act-body"><div class="q-en">${q.en}</div>`;
  if(q.type==='tf')   h+=buildTF(q);
  if(q.type==='fill') h+=buildFill(q);
  if(q.type==='match')h+=buildMatch(q);
  if(q.type==='mc')   h+=buildMC(q);
  if(q.type==='seq')  h+=buildSeq(q);
  if(q.type==='disc') h+=buildDisc(q);
  if(q.type==='ce')   h+=buildCE(q);
  h+=`</div></div>`;
  return h;
}

/* ── TF ── */
function buildTF(q){
  let h=`<table class="tf-table"><tr><th>Statement</th><th class="th-tf">True / False</th></tr>`;
  q.rows.forEach((row,i)=>{
    h+=`<tr class="tf-row"><td>
      <div>${row.en}</div>
      <div id="cw-${q.id}-${i}" class="corr-wrap" style="display:none;">
        <span class="corr-lbl">✏️ What's wrong? Write the correction: (English or 한국어)</span>
        <textarea class="corr-ta" id="corr-${q.id}-${i}" placeholder="The statement says … but actually …"></textarea>
      </div>
    </td><td><div class="tf-btns">
      <button class="tf-btn" id="tft-${q.id}-${i}" onclick="pickTF('${q.id}',${i},'T')">True</button>
      <button class="tf-btn" id="tff-${q.id}-${i}" onclick="pickTF('${q.id}',${i},'F')">False</button>
    </div></td></tr>`;
  });
  h+=`</table><div class="sub-row"><button class="btn-sub" id="tfsub-${q.id}" onclick="subTF('${q.id}')" disabled>Submit →</button></div>`;
  return h;
}
function pickTF(qid,i,val){
  if(!tfSt[qid])tfSt[qid]=[];
  tfSt[qid][i]=val;
  document.getElementById(`tft-${qid}-${i}`).className='tf-btn'+(val==='T'?' sel-t':'');
  document.getElementById(`tff-${qid}-${i}`).className='tf-btn'+(val==='F'?' sel-f':'');
  document.getElementById(`cw-${qid}-${i}`).style.display=val==='F'?'block':'none';
  const q=Qs.find(x=>x.id===qid);
  if(tfSt[qid].filter(v=>v!=null).length===q.rows.length)
    document.getElementById(`tfsub-${qid}`).disabled=false;
}
function subTF(qid){
  const q=Qs.find(x=>x.id===qid);
  const lines=q.rows.map((row,i)=>{
    const pick=tfSt[qid][i];
    const corr=(document.getElementById(`corr-${qid}-${i}`)?.value||'').trim();
    let line=`${i+1}. [${pick}] ${row.en}`;
    if(pick==='F'&&corr) line+=`\n   Correction: ${corr}`;
    return line;
  });
  responses[cur]=lines.join('\n');
  document.querySelectorAll(`[id^="tft-${qid}"],[id^="tff-${qid}"]`).forEach(b=>b.disabled=true);
  document.querySelectorAll(`[id^="corr-${qid}-"]`).forEach(t=>t.disabled=true);
  document.getElementById(`tfsub-${qid}`).disabled=true;
  markDone(qid);
}

/* ── FILL ── */
function buildFill(q){
  let s=q.sent;
  q.blanks.forEach(b=>{s=s.replace(`[${b.id}]`,`<span class="blank" id="bl-${q.id}-${b.id}" onclick="rmBlank('${q.id}','${b.id}')">[${b.id}]</span>`);});
  const sh=[...q.choices].sort(()=>Math.random()-.5);
  let h=`<div class="fill-sent">${s}</div><div class="chips" id="ch-${q.id}">`;
  sh.forEach(c=>{h+=`<button class="chip" onclick="placeChip('${q.id}','${encodeURIComponent(c)}')">${c}</button>`;});
  h+=`</div><div class="sub-row"><button class="btn-sub" id="fsub-${q.id}" onclick="subFill('${q.id}')">Submit →</button></div>`;
  return h;
}
function placeChip(qid,enc){
  const word=decodeURIComponent(enc);
  const q=Qs.find(x=>x.id===qid),st=fillSt[qid]||{};
  const empty=q.blanks.find(b=>!st[b.id]);if(!empty)return;
  Array.from(document.querySelectorAll(`#ch-${qid} .chip`)).find(c=>c.textContent===word&&!c.classList.contains('used'))?.classList.add('used');
  st[empty.id]=word;fillSt[qid]=st;
  const slot=document.getElementById(`bl-${qid}-${empty.id}`);
  slot.textContent=word;slot.classList.add('filled');
}
function rmBlank(qid,bid){
  const st=fillSt[qid]||{},word=st[bid];if(!word)return;
  delete st[bid];fillSt[qid]=st;
  const slot=document.getElementById(`bl-${qid}-${bid}`);
  slot.textContent=`[${bid}]`;slot.classList.remove('filled');
  Array.from(document.querySelectorAll(`#ch-${qid} .chip`)).find(c=>c.textContent===word&&c.classList.contains('used'))?.classList.remove('used');
}
function subFill(qid){
  const q=Qs.find(x=>x.id===qid),st=fillSt[qid]||{};
  if(!q.blanks.every(b=>st[b.id])){alert('Please fill in all the blanks.');return;}
  responses[cur]=q.blanks.map(b=>`[${b.id}] ${st[b.id]}`).join('\n');
  Array.from(document.querySelectorAll(`#ch-${qid} .chip`)).forEach(c=>c.disabled=true);
  document.getElementById(`fsub-${qid}`).disabled=true;
  markDone(qid);
}

/* ── MATCH ── */
function buildMatch(q){
  const shR=[...q.rights].sort(()=>Math.random()-.5);
  let h=`<div class="match-hint">Tap a person or term on the left → then tap its matching description on the right. Tap a matched pair to undo it.</div>
  <div class="match-sel-banner" id="msel-${q.id}"></div>
  <div class="match-grid">
    <div><div class="match-col-lbl">Person / Term</div><div class="match-items" id="ml-${q.id}">`;
  q.lefts.forEach(l=>{h+=`<div class="match-item" id="ml-${l.id}" onclick="clkL('${q.id}','${l.id}')">${l.t}</div>`;});
  h+=`</div></div><div><div class="match-col-lbl">Description</div><div class="match-items" id="mr-${q.id}">`;
  shR.forEach(r=>{h+=`<div class="match-item" id="mr-${r.id}" onclick="clkR('${q.id}','${r.id}')">${r.t}</div>`;});
  h+=`</div></div></div><div class="sub-row" style="margin-top:.9rem;"><button class="btn-sub" id="msub-${q.id}" onclick="subMatch('${q.id}')" disabled>Submit →</button></div>`;
  return h;
}
function clkL(qid,lid){
  const st=matchSt[qid];if(!st)return;
  const el=document.getElementById(`ml-${lid}`),banner=document.getElementById(`msel-${qid}`);
  if(el.classList.contains('matched')){
    const pr=st.pairs[lid];
    if(pr){document.getElementById(`mr-${pr}`).classList.remove('matched');delete st.pairs[lid];}
    el.classList.remove('matched');updMatchSub(qid);banner.classList.remove('active');return;
  }
  const already=el.classList.contains('sel');
  document.querySelectorAll(`#ml-${qid} .match-item`).forEach(e=>e.classList.remove('sel'));
  if(!already){st.leftSel=lid;el.classList.add('sel');banner.textContent=`👆 "${el.textContent}" selected — now tap a description on the right`;banner.classList.add('active');}
  else{st.leftSel=null;banner.classList.remove('active');}
}
function clkR(qid,rid){
  const st=matchSt[qid];if(!st)return;
  const rEl=document.getElementById(`mr-${rid}`),banner=document.getElementById(`msel-${qid}`);
  if(rEl.classList.contains('matched')){
    const pl=Object.keys(st.pairs).find(k=>st.pairs[k]===rid);
    if(pl){document.getElementById(`ml-${pl}`).classList.remove('matched');delete st.pairs[pl];}
    rEl.classList.remove('matched');updMatchSub(qid);banner.classList.remove('active');return;
  }
  if(!st.leftSel)return;
  const lEl=document.getElementById(`ml-${st.leftSel}`);
  rEl.classList.add('matched');lEl.classList.add('matched');lEl.classList.remove('sel');
  st.pairs[st.leftSel]=rid;st.leftSel=null;banner.classList.remove('active');updMatchSub(qid);
}
function updMatchSub(qid){
  const q=Qs.find(x=>x.id===qid);
  document.getElementById(`msub-${qid}`).disabled=Object.keys(matchSt[qid].pairs).length<q.lefts.length;
}
function subMatch(qid){
  const q=Qs.find(x=>x.id===qid),st=matchSt[qid];
  responses[cur]=q.lefts.map(l=>{const r=q.rights.find(r=>r.id===st.pairs[l.id]);return `${l.t}\n  → ${r?r.t:'(unmatched)'}`;}).join('\n\n');
  document.getElementById(`msub-${qid}`).disabled=true;
  document.querySelectorAll(`#ml-${qid} .match-item,#mr-${qid} .match-item`).forEach(el=>el.style.pointerEvents='none');
  markDone(qid);
}

/* ── MULTIPLE CHOICE ── */
function buildMC(q){
  let h=`<div class="mc-note">🔘 Choose the ONE best answer for each question.</div><div class="mc-qs">`;
  q.qs.forEach((item,qi)=>{
    h+=`<div class="mc-q-block"><div class="mc-q-text">${qi+1}. ${item.q}</div><div class="mc-opts">`;
    item.opts.forEach((opt,oi)=>{
      const letter=String.fromCharCode(65+oi);
      h+=`<div class="mc-opt" id="mc-${q.id}-${qi}-${oi}" onclick="pickMC('${q.id}',${qi},${oi})">
        <span class="mc-letter">${letter}</span><span>${opt}</span></div>`;
    });
    h+=`</div></div>`;
  });
  h+=`</div><div class="sub-row"><button class="btn-sub" id="mcsub-${q.id}" onclick="subMC('${q.id}')" disabled>Submit →</button></div>`;
  return h;
}
function pickMC(qid,qi,oi){
  if(!mcSt[qid])mcSt[qid]=[];
  mcSt[qid][qi]=oi;
  const q=Qs.find(x=>x.id===qid);
  q.qs[qi].opts.forEach((_,i)=>document.getElementById(`mc-${qid}-${qi}-${i}`)?.classList.remove('sel'));
  document.getElementById(`mc-${qid}-${qi}-${oi}`)?.classList.add('sel');
  if(mcSt[qid].filter(v=>v!=null).length===q.qs.length)
    document.getElementById(`mcsub-${qid}`).disabled=false;
}
function subMC(qid){
  const q=Qs.find(x=>x.id===qid);
  responses[cur]=q.qs.map((item,i)=>{
    const sel=mcSt[qid][i];
    const letter=sel!=null?String.fromCharCode(65+sel):'?';
    return `Q${i+1}: ${letter}) ${sel!=null?item.opts[sel]:''}`;
  }).join('\n');
  document.querySelectorAll(`[id^="mc-${qid}-"]`).forEach(el=>el.classList.add('mc-disabled'));
  document.getElementById(`mcsub-${qid}`).disabled=true;
  markDone(qid);
}

/* ── SEQUENCING ── */
function buildSeq(q){
  return `<div class="sq-note">⬆⬇ Drag the events into chronological order — earliest at the top.<br>📱 On mobile: tap one item, then tap another to swap them.</div>
  <div class="sq-items" id="sq-${q.id}"></div>
  <div class="sub-row"><button class="btn-sub" id="sqsub-${q.id}" onclick="subSeq('${q.id}')">Submit →</button></div>`;
}
function renderSeqItems(qid){
  const container=document.getElementById(`sq-${qid}`);
  if(!container)return;
  container.innerHTML='';
  seqSt[qid].forEach((item,idx)=>{
    const div=document.createElement('div');
    div.className='sq-item';div.id='sqitem-'+item.id;div.draggable=true;
    div.innerHTML=`<span class="sq-handle">⠿</span><span class="sq-num">${idx+1}</span><span>${item.t}</span>`;
    div.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',item.id);setTimeout(()=>div.classList.add('dragging'),0);});
    div.addEventListener('dragend',()=>div.classList.remove('dragging'));
    div.addEventListener('dragover',e=>{e.preventDefault();div.classList.add('drag-over');});
    div.addEventListener('dragleave',()=>div.classList.remove('drag-over'));
    div.addEventListener('drop',e=>{
      e.preventDefault();div.classList.remove('drag-over');
      const fromId=e.dataTransfer.getData('text/plain');
      const toId=item.id;if(fromId===toId)return;
      const arr=seqSt[qid];
      const fi=arr.findIndex(x=>x.id===fromId),ti=arr.findIndex(x=>x.id===toId);
      if(fi<0||ti<0)return;
      const tmp=arr[fi];arr[fi]=arr[ti];arr[ti]=tmp;
      renderSeqItems(qid);
    });
    div.addEventListener('click',()=>{
      const sel=seqTapSel[qid];
      if(!sel){seqTapSel[qid]=item.id;div.classList.add('tapped');}
      else if(sel===item.id){seqTapSel[qid]=null;div.classList.remove('tapped');}
      else{
        const arr=seqSt[qid];
        const fi=arr.findIndex(x=>x.id===sel),ti=arr.findIndex(x=>x.id===item.id);
        if(fi>=0&&ti>=0){const tmp=arr[fi];arr[fi]=arr[ti];arr[ti]=tmp;}
        seqTapSel[qid]=null;
        renderSeqItems(qid);
      }
    });
    container.appendChild(div);
  });
}
function subSeq(qid){
  responses[cur]=seqSt[qid].map((item,i)=>`${i+1}. ${item.t}`).join('\n');
  document.querySelectorAll(`#sq-${qid} .sq-item`).forEach(el=>{el.draggable=false;el.style.cursor='default';el.style.pointerEvents='none';});
  document.getElementById(`sqsub-${qid}`).disabled=true;
  markDone(qid);
}

/* ── DISCUSSION ── */
function buildDisc(q){
  let h=`<div class="rj-note">💬 Discuss as a group first, then write your group's answers below.</div>
  <div class="lang-note">✏️ You may write in English or 한국어 — or both.</div>
  <div class="disc-subqs">`;
  q.subqs.forEach((sq,i)=>{
    h+=`<div class="disc-subq"><span class="disc-subq-label">Question ${i+1}</span>
    <div class="disc-subq-q">${sq.q}</div>
    <textarea class="disc-ta" id="disc-${q.id}-${i}" placeholder="Your group's answer… (English or 한국어)"></textarea></div>`;
  });
  h+=`</div><div class="sub-row"><button class="btn-sub" id="discsub-${q.id}" onclick="subDisc('${q.id}')">Submit →</button></div>`;
  return h;
}
function subDisc(qid){
  const q=Qs.find(x=>x.id===qid);
  const vals=q.subqs.map((_,i)=>document.getElementById(`disc-${qid}-${i}`).value.trim());
  if(vals.some(v=>!v)){alert('Please answer all questions.');return;}
  responses[cur]=vals.map((v,i)=>`Q${i+1}: ${v}`).join('\n\n');
  q.subqs.forEach((_,i)=>document.getElementById(`disc-${qid}-${i}`).disabled=true);
  document.getElementById(`discsub-${qid}`).disabled=true;
  markDone(qid);
}

/* ── CAUSE & EFFECT ── */
function buildCE(q){
  let h=`<div class="ce-note">📖 For each event, write its main cause and most important effect.</div>
  <div class="ce-lang-note">✏️ You may write in English or 한국어 — or both.</div>
  <div class="ce-cards">`;
  q.rows.forEach((row,i)=>{
    h+=`<div class="ce-card"><div class="ce-card-head"><span class="ce-card-event">${row.event}</span></div>
    <div class="ce-card-body">
      <div class="ce-field"><span class="ce-field-lbl">Main Cause</span>
        <textarea class="ce-ta" id="ce-c-${q.id}-${i}" placeholder="Why did this happen? (English or 한국어)"></textarea></div>
      <div class="ce-field"><span class="ce-field-lbl">Most Important Effect</span>
        <textarea class="ce-ta" id="ce-e-${q.id}-${i}" placeholder="What changed? (English or 한국어)"></textarea></div>
    </div></div>`;
  });
  h+=`</div><div class="sub-row" style="margin-top:.75rem;"><button class="btn-sub" id="cesub-${q.id}" onclick="subCE('${q.id}')">Submit →</button></div>`;
  return h;
}
function subCE(qid){
  const q=Qs.find(x=>x.id===qid);
  if(!q.rows.some((_,i)=>document.getElementById(`ce-c-${qid}-${i}`).value.trim())){alert('Please fill in at least one row.');return;}
  responses[cur]=q.rows.map((row,i)=>{
    const c=document.getElementById(`ce-c-${qid}-${i}`).value.trim();
    const e=document.getElementById(`ce-e-${qid}-${i}`).value.trim();
    return `${row.event}:\n  Cause: ${c||'—'}\n  Effect: ${e||'—'}`;
  }).join('\n\n');
  q.rows.forEach((_,i)=>{
    document.getElementById(`ce-c-${qid}-${i}`).disabled=true;
    document.getElementById(`ce-e-${qid}-${i}`).disabled=true;
  });
  document.getElementById(`cesub-${qid}`).disabled=true;
  markDone(qid);
}

/* ── DONE / NEXT ── */
function markDone(qid){
  submitted[cur]=true;updProg();
  const body=document.querySelector('.act-body');
  const badge=document.createElement('div');badge.className='done-badge';
  badge.innerHTML='✅ Answer recorded — check the model answer on the results screen';
  body.appendChild(badge);
  const btn=document.createElement('button');btn.className='btn-next-q';
  btn.textContent=cur+1<Qs.length?'Next Question →':'See Results ✓';
  btn.onclick=nextQ;body.appendChild(btn);
}
function nextQ(){cur++;document.getElementById('main').innerHTML='';render();window.scrollTo({top:0,behavior:'smooth'});}

/* ── FINAL ── */
function showFinal(){
  document.getElementById('main').style.display='none';
  const screen=document.getElementById('final-screen');screen.style.display='block';
  const memberStr=members.join(' · ');
  let copyText=`=== 1920s · GREAT DEPRESSION · ATOMIC AGE · BABY BOOM (R11-14) ===\nMembers: ${memberStr}\n\n`;
  Qs.forEach((q,i)=>{
    let resp=responses[i]||'(no answer)';
    if(q.type==='mc'&&mcSt[q.id]){
      resp=q.qs.map((item,qi)=>{
        const sel=mcSt[q.id][qi];
        const letter=sel!=null?String.fromCharCode(65+sel):'?';
        const correct=sel===item.ans;
        const corrLetter=String.fromCharCode(65+item.ans);
        return (correct?'✅':'❌')+' Q'+(qi+1)+': '+letter+') '+(sel!=null?item.opts[sel]:'?')+(correct?'':' → Correct: '+corrLetter+') '+item.opts[item.ans]);
      }).join('\n');
    }
    if(q.type==='seq'&&seqSt[q.id]){
      resp=seqSt[q.id].map((item,idx)=>(item.order===idx+1?'✅':'❌')+' '+(idx+1)+'. '+item.t).join('\n');
    }
    copyText+=`[Q${i+1} · R${q.r} · ${LABELS[q.type]}]\n${q.en.replace(/<[^>]+>/g,'')}\n→ ${resp}\n\n`;
  });

  const rGroups=[
    {r:'11+12',label:'R11+R12 — 1920s & Great Depression'},
    {r:'13',label:'R13 — The Atomic Bomb'},
    {r:'14',label:'R14 — The Baby Boom'},
    {r:'13+14',label:'R13+R14 — Atomic Age & Baby Boom'},
    {r:'11–14',label:'R11–R14 — Era Summary'},
  ];

  let html=`<div class="final-hero"><div class="fi">🎉</div><h2>Activity Complete!</h2>
  <p>Great work! Copy your answers below and post them to Padlet.</p>
  <div class="final-group-tag">👥 ${memberStr}</div>
  <div class="score-row">
    <div class="score-item"><span class="score-n">${Qs.length}</span><span class="score-l">Questions</span></div>
    <div class="score-item"><span class="score-n">${submitted.filter(Boolean).length}</span><span class="score-l">Completed</span></div>
  </div></div>`;

  rGroups.forEach(({r,label})=>{
    const rQs=Qs.map((q,i)=>({q,i})).filter(({q})=>q.r===r);
    if(!rQs.length)return;
    html+=`<div class="ans-section"><div class="ans-section-title">${label}</div><div class="ans-cards">`;
    rQs.forEach(({q,i})=>{
      const qNum=i+1;
      let respDisplay=responses[i]||'(no answer)';
      if(q.type==='mc'&&mcSt[q.id]){
        respDisplay=q.qs.map((item,qi)=>{
          const sel=mcSt[q.id][qi];
          const letter=sel!=null?String.fromCharCode(65+sel):'?';
          const correct=sel===item.ans;
          const mark=correct?'\u2705':'\u274c';
          const corrLetter=String.fromCharCode(65+item.ans);
          return mark+' Q'+(qi+1)+': '+letter+') '+(sel!=null?item.opts[sel]:'(no answer)')+(correct?'':'\n   \u2192 Correct: '+corrLetter+') '+item.opts[item.ans]);
        }).join('\n');
      }
      if(q.type==='seq'&&seqSt[q.id]){
        const correctOrder=[...q.items].sort((a,b)=>a.order-b.order);
        const yourLines=seqSt[q.id].map((item,idx)=>{
          const correct=item.order===idx+1;
          return (correct?'\u2705':'\u274c')+' '+(idx+1)+'. '+item.t;
        }).join('\n');
        const corrLines=correctOrder.map((item,idx)=>(idx+1)+'. '+item.t).join('\n');
        respDisplay=yourLines+'\n\n\u2714 Correct order:\n'+corrLines;
      }
      html+=`<div class="ans-card"><div class="ans-head">
        <span class="type-pill ${PILLS[q.type]}" style="font-size:.57rem;">${LABELS[q.type]}</span>
        <span class="ans-qtext"><strong>Q${qNum}.</strong> ${q.en.replace(/<[^>]+>/g,'')}</span>
      </div><div class="ans-body">
        <div class="ans-response">${respDisplay}</div>
        <div class="ans-model"><strong>💡 Model Answer:</strong><br>${q.model}</div>
      </div></div>`;
    });
    html+=`</div></div>`;
  });

  html+=`<div class="copy-box"><h3>📋 Post to Padlet</h3>
  <p>Copy the text below and paste it into Padlet.</p>
  <textarea id="copy-ta" readonly onclick="this.select()">${copyText.trim()}</textarea>
  <div class="copy-btns">
    <button class="btn-copy" id="bcopy" onclick="doCopy()">📋 Copy All</button>
    <button class="btn-restart" onclick="location.reload()">↺ Restart</button>
  </div></div>`;
  screen.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});
}
function doCopy(){
  const ta=document.getElementById('copy-ta');ta.select();
  navigator.clipboard.writeText(ta.value).then(()=>{
    const b=document.getElementById('bcopy');b.textContent='✓ Copied!';b.classList.add('ok');
    setTimeout(()=>{b.textContent='📋 Copy All';b.classList.remove('ok');},2500);
  }).catch(()=>document.execCommand('copy'));
}
</script>
</body>
</html>
