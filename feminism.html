<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Feminism in the U.S. — True or False Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #faf8f3;
      color: #1a1714;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    .page-wrap { max-width: 680px; margin: 0 auto; }

    header {
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1.5px solid #e2ddd6;
    }

    .course-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #b8510a;
      background: #fef0e6;
      padding: 4px 10px;
      border-radius: 4px;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 400;
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }

    h1 em { font-style: italic; color: #b8510a; }

    .subtitle { font-size: 14px; color: #6b6560; line-height: 1.6; }

    .progress-bar-wrap { margin-bottom: 1.5rem; }

    .progress-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .progress-label { font-size: 12px; font-weight: 500; color: #6b6560; }
    .progress-count { font-size: 12px; font-weight: 600; color: #b8510a; }

    .progress-track {
      height: 3px;
      background: #e2ddd6;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #b8510a;
      border-radius: 999px;
      transition: width 0.3s ease;
      width: 0%;
    }

    .q-card {
      background: #fff;
      border: 1px solid #e2ddd6;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 10px;
    }

    .q-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 0.875rem;
    }

    .q-badge {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #faf8f3;
      border: 1px solid #e2ddd6;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
      color: #6b6560;
      margin-top: 1px;
    }

    .q-text {
      font-size: 14.5px;
      line-height: 1.65;
      flex: 1;
    }

    .tf-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    /* 핵심: label + hidden checkbox 방식으로 터치 문제 해결 */
    .tf-row input[type="radio"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .tf-label {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 0;
      border-radius: 8px;
      border: 1.5px solid #e2ddd6;
      background: #faf8f3;
      font-size: 14px;
      font-weight: 600;
      color: #6b6560;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    .tf-label:active { opacity: 0.75; }

    input[type="radio"].opt-t:checked ~ .tf-row .tf-label-t,
    .tf-label-t.sel {
      background: #e8f0fe;
      border-color: #3b6fd4;
      color: #1a3a7a;
    }

    input[type="radio"].opt-f:checked ~ .tf-row .tf-label-f,
    .tf-label-f.sel {
      background: #fdf0e8;
      border-color: #c4621a;
      color: #6b2d08;
    }

    .tf-label.correct {
      background: #e8f5e8 !important;
      border-color: #3d8b3d !important;
      color: #1a4d1a !important;
    }

    .tf-label.wrong {
      background: #fde8e8 !important;
      border-color: #cc3333 !important;
      color: #6b1515 !important;
    }

    .tf-label.disabled { cursor: default; pointer-events: none; }

    .feedback {
      display: none;
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }

    .feedback.show { display: block; }

    .fb-correct {
      background: #e8f5e8;
      color: #1a4d1a;
      border-left: 3px solid #3d8b3d;
    }

    .fb-wrong {
      background: #fde8e8;
      color: #6b1515;
      border-left: 3px solid #cc3333;
    }

    .actions { margin-top: 1.5rem; display: flex; gap: 10px; }

    .btn-submit {
      flex: 1;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: #b8510a;
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-submit:active { opacity: 0.85; }

    .btn-reset {
      padding: 14px 20px;
      border-radius: 12px;
      border: 1.5px solid #e2ddd6;
      background: #fff;
      color: #6b6560;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn-reset.visible { display: block; }
    .btn-reset:active { opacity: 0.75; }

    .result-panel {
      display: none;
      margin-top: 1.5rem;
      background: #fff;
      border: 1px solid #e2ddd6;
      border-radius: 12px;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    .result-panel.show { display: block; }

    .result-score-ring {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      border: 3px solid #b8510a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
      background: #fef0e6;
    }

    .result-num {
      font-family: 'DM Serif Display', serif;
      font-size: 30px;
      color: #b8510a;
      line-height: 1;
    }

    .result-denom { font-size: 11px; color: #b8510a; font-weight: 500; }

    .result-title {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      margin-bottom: 0.4rem;
    }

    .result-msg {
      font-size: 14px;
      color: #6b6560;
      line-height: 1.6;
      max-width: 380px;
      margin: 0 auto;
    }

    .result-breakdown {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1.25rem;
      padding-top: 1.25rem;
      border-top: 1px solid #e2ddd6;
    }

    .bd-item { text-align: center; }
    .bd-num { font-size: 22px; font-weight: 600; }
    .bd-label { font-size: 11px; color: #9e9892; text-transform: uppercase; letter-spacing: 0.06em; }
    .bd-correct .bd-num { color: #1a4d1a; }
    .bd-wrong .bd-num { color: #6b1515; }

    @media (max-width: 480px) {
      body { padding: 1.25rem 0.875rem 3rem; }
      h1 { font-size: 24px; }
      .q-card { padding: 1rem 1.125rem; }
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <header>
      <div class="course-tag">영미문화의 이해</div>
      <h1>Feminism in the U.S.<br><em>True or False?</em></h1>
      <p class="subtitle">Answer all 12 questions, then click Submit to see your score.</p>
    </header>

    <div class="progress-bar-wrap">
      <div class="progress-info">
        <span class="progress-label">Progress</span>
        <span class="progress-count" id="prog-count">0 / 12</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="prog-fill"></div>
      </div>
    </div>

    <div id="quiz-body"></div>

    <div class="actions">
      <button class="btn-submit" id="btn-submit">Submit answers</button>
      <button class="btn-reset" id="btn-reset">Try again</button>
    </div>

    <div class="result-panel" id="result-panel">
      <div class="result-score-ring">
        <span class="result-num" id="res-num">0</span>
        <span class="result-denom">/ 12</span>
      </div>
      <div class="result-title" id="res-title"></div>
      <div class="result-msg" id="res-msg"></div>
      <div class="result-breakdown">
        <div class="bd-item bd-correct">
          <div class="bd-num" id="bd-correct">0</div>
          <div class="bd-label">Correct</div>
        </div>
        <div class="bd-item bd-wrong">
          <div class="bd-num" id="bd-wrong">0</div>
          <div class="bd-label">Incorrect</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var questions = [
      { num: 1, text: "Lucretia Mott, a female abolitionist, was warmly welcomed at an antislavery convention held in London, England, in 1840.", answer: "F", explanation: "She was <strong>denied a seat</strong> at the convention because she was a woman — that exclusion motivated her to fight for women's rights alongside Elizabeth Cady Stanton." },
      { num: 2, text: "Most Americans supported the goals of the Seneca Falls Convention.", answer: "F", explanation: "Reactions ranged from <strong>outrage to ridicule</strong>. Critics called it 'the most shocking and unnatural incident ever recorded' and dismissed it as a 'petticoat rebellion.'" },
      { num: 3, text: "Elizabeth Cady Stanton organized the Seneca Falls Convention with Lucretia Mott.", answer: "T", explanation: "After meeting in London in 1840, Mott and Stanton together organized the first women's rights convention in <strong>Seneca Falls, New York, in July 1848</strong>." },
      { num: 4, text: "Elizabeth Cady Stanton contributed to the approval for the 13th Amendment.", answer: "T", explanation: "During the Civil War, Stanton and Susan B. Anthony campaigned for the <strong>13th Amendment</strong>, which abolished slavery in the United States." },
      { num: 5, text: "Frederick Douglass was not much concerned with women's rights.", answer: "F", explanation: "Douglass was actually described as a <strong>'strong defender of women's rights.'</strong> He asked women to wait before pushing for inclusion in the 14th Amendment for strategic reasons, not indifference." },
      { num: 6, text: "Many abolitionists opposed the inclusion of women's rights in the 14th Amendment, arguing that it would make the amendment harder to pass.", answer: "T", explanation: "Abolitionist leaders told women to wait, arguing that adding women's rights would <strong>jeopardize the passage</strong> of the 14th Amendment guaranteeing Black males' citizenship and voting rights." },
      { num: 7, text: "In 1878, Congress passed the Susan B. Anthony Amendment.", answer: "F", explanation: "Senator Sargent <strong>introduced</strong> the amendment in 1878, but Congress did not pass it until <strong>1919</strong> — it was re-introduced almost every year for over 40 years." },
      { num: 8, text: "In 1919, the Susan B. Anthony Amendment was ratified by the states as the 19th Amendment.", answer: "F", explanation: "Congress <strong>passed</strong> it in 1919, but the states <strong>ratified</strong> it in <strong>1920</strong>, when it officially became the 19th Amendment granting women the right to vote." },
      { num: 9, text: "The author of The Feminine Mystique helped found the National Organization for Women.", answer: "T", explanation: "<strong>Betty Friedan</strong>, who wrote The Feminine Mystique (1963), co-founded NOW in <strong>1966</strong> to push for stronger women's rights laws." },
      { num: 10, text: "Some women groups, espcially led by Phyllis Schlafly, were against the ERA because they thought it would remove laws protecting women.", answer: "T", explanation: "Opposition leader <strong>Phyllis Schlafly</strong> argued the ERA would remove existing legal protections for women and destroy the traditional family." },
      { num: 11, text: "The Feminine Mystique adequately addressed the concerns of Black and minority women.", answer: "F", explanation: "The book focused mainly on <strong>white middle-class women</strong>. The second-wave feminist movement largely failed to address the concerns of Black and minority women." },
      { num: 12, text: "The Equal Rights Amendment finally became law in 1972.", answer: "F", explanation: "Congress <strong>passed</strong> the ERA in 1972, but it needed ratification from 38 states and only got 35. The ERA has <strong>never officially become law</strong>." }
    ];

    var answers = {};
    var submitted = false;

    function renderQuiz() {
      var body = document.getElementById('quiz-body');
      body.innerHTML = '';
      questions.forEach(function(q) {
        var card = document.createElement('div');
        card.className = 'q-card';
        card.innerHTML =
          '<div class="q-header">' +
            '<div class="q-badge">' + q.num + '</div>' +
            '<div class="q-text">' + q.text + '</div>' +
          '</div>' +
          '<div class="tf-row">' +
            '<label class="tf-label tf-label-t" id="lbl-' + q.num + '-T">T — True</label>' +
            '<label class="tf-label tf-label-f" id="lbl-' + q.num + '-F">F — False</label>' +
          '</div>' +
          '<div class="feedback" id="fb-' + q.num + '"></div>';
        body.appendChild(card);

        /* label 직접 클릭 이벤트 — touchend 사용으로 300ms 딜레이 제거 */
        var lblT = card.querySelector('.tf-label-t');
        var lblF = card.querySelector('.tf-label-f');

        function pickAnswer(val) {
          if (submitted) return;
          answers[q.num] = val;
          lblT.classList.toggle('sel', val === 'T');
          lblF.classList.toggle('sel', val === 'F');
          updateProgress();
        }

        lblT.addEventListener('touchend', function(e) { e.preventDefault(); pickAnswer('T'); });
        lblF.addEventListener('touchend', function(e) { e.preventDefault(); pickAnswer('F'); });
        lblT.addEventListener('click', function() { if (!submitted) pickAnswer('T'); });
        lblF.addEventListener('click', function() { if (!submitted) pickAnswer('F'); });
      });
    }

    function updateProgress() {
      var count = Object.keys(answers).length;
      document.getElementById('prog-count').textContent = count + ' / 12';
      document.getElementById('prog-fill').style.width = (count / 12 * 100) + '%';
    }

    function submitQuiz() {
      if (submitted) return;
      if (Object.keys(answers).length < 12) {
        alert('Please answer all 12 questions before submitting.');
        return;
      }
      submitted = true;
      var score = 0;

      questions.forEach(function(q) {
        var userAns = answers[q.num];
        var correct = userAns === q.answer;
        if (correct) score++;

        var lblT = document.getElementById('lbl-' + q.num + '-T');
        var lblF = document.getElementById('lbl-' + q.num + '-F');

        lblT.classList.add('disabled');
        lblF.classList.add('disabled');
        lblT.classList.remove('sel');
        lblF.classList.remove('sel');

        var correctLbl = q.answer === 'T' ? lblT : lblF;
        var wrongLbl   = q.answer === 'T' ? lblF : lblT;
        correctLbl.classList.add('correct');
        if (!correct) wrongLbl.classList.add('wrong');

        var fb = document.getElementById('fb-' + q.num);
        fb.innerHTML = '<strong>' + (correct ? '✓ Correct' : '✗ Incorrect') + '</strong> — ' + q.explanation;
        fb.className = 'feedback show ' + (correct ? 'fb-correct' : 'fb-wrong');
      });

      var titles = ['Keep studying!', 'Good effort!', 'Nice work!', 'Excellent!', 'Perfect score!'];
      var msgs   = [
        "Review the slides and try again. You'll get there!",
        "You're getting there — a few more to review.",
        "Almost there! Check the explanations for the ones you missed.",
        "Really well done! Just a couple more to nail.",
        "Outstanding! You've mastered this material."
      ];
      var idx = score <= 4 ? 0 : score <= 7 ? 1 : score <= 9 ? 2 : score <= 11 ? 3 : 4;

      document.getElementById('res-num').textContent = score;
      document.getElementById('res-title').textContent = titles[idx];
      document.getElementById('res-msg').textContent = msgs[idx];
      document.getElementById('bd-correct').textContent = score;
      document.getElementById('bd-wrong').textContent = 12 - score;
      document.getElementById('result-panel').className = 'result-panel show';
      document.getElementById('btn-reset').className = 'btn-reset visible';
      document.getElementById('btn-submit').style.display = 'none';
      document.getElementById('result-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function resetQuiz() {
      answers = {};
      submitted = false;
      document.getElementById('result-panel').className = 'result-panel';
      document.getElementById('btn-reset').className = 'btn-reset';
      document.getElementById('btn-submit').style.display = '';
      renderQuiz();
      updateProgress();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('btn-submit').addEventListener('touchend', function(e) { e.preventDefault(); submitQuiz(); });
    document.getElementById('btn-submit').addEventListener('click', submitQuiz);
    document.getElementById('btn-reset').addEventListener('touchend', function(e) { e.preventDefault(); resetQuiz(); });
    document.getElementById('btn-reset').addEventListener('click', resetQuiz);

    renderQuiz();
  </script>
</body>
</html>
